<style>
/* Layout: sticky nav, split hero with app window, feature grid, how-it-works rail, two-edition comparison, screenshot strip, honest costs, FAQ, contact band. Brand look: black with gold, taken from the program itself. Single committed dark look. */
:root{color-scheme:dark;
  --bg:#0b0b0e; --bg2:#121217; --card:#17171d; --line:#2a2a33; --fg:#f2efe6; --muted:#a29f94;
  --gold:#e3b341; --gold-d:#a9812a; --gold-bg:#2a2212; --ink:#17120a;
  --f-display:'Unbounded','Manrope',system-ui,sans-serif; --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.w{max-width:1080px;margin:0 auto}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
nav .w{display:flex;align-items:center;gap:14px;padding-block:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:16px;letter-spacing:.02em;text-decoration:none;color:var(--fg)}
.logo i{font-style:normal;display:block;font-size:9px;letter-spacing:.18em;color:var(--ink);background:var(--gold);padding:1px 7px;border-radius:4px;width:max-content;margin-bottom:2px}
.sp{flex:1}
nav a.l{color:var(--muted);text-decoration:none;font-weight:700;font-size:14px}
nav a.l:hover{color:var(--gold)}
.lang{display:flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{font:inherit;font-size:13px;font-weight:700;padding:6px 13px;border:0;background:transparent;color:var(--fg);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--gold);color:var(--ink)}
.btn{display:inline-block;font:inherit;font-weight:800;font-size:15px;padding:12px 22px;border-radius:10px;background:var(--gold);color:var(--ink);text-decoration:none;border:0;cursor:pointer}
.btn:hover{background:#f0c75a}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold)}
a:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:36px;align-items:center;padding-block:54px 40px}
.kick{font-family:var(--f-display);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600}
h1{font-family:var(--f-body);font-weight:800;font-size:clamp(30px,5vw,50px);line-height:1.1;margin:14px 0 16px;text-wrap:balance}
.sub{color:var(--muted);font-size:18px;max-width:46ch;margin:0 0 24px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.win{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);box-shadow:0 24px 60px -20px #000}
.win .bar{display:flex;gap:6px;padding:9px 12px;background:var(--bg2);border-bottom:1px solid var(--line)}
.win .bar b{width:10px;height:10px;border-radius:50%;background:var(--line)}
.win img{display:block;width:100%;height:auto}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-block:8px 0}
.stats div{background:var(--bg2);padding:18px 16px}
.stats b{display:block;font-family:var(--f-display);font-size:24px;color:var(--gold);font-weight:800}
.stats span{color:var(--muted);font-size:14px}
section{padding-block:64px 0}
h2{font-family:var(--f-body);font-weight:800;font-size:clamp(24px,3.6vw,34px);line-height:1.15;margin:0 0 10px;text-wrap:balance}
.lead{color:var(--muted);max-width:60ch;margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.f{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
.f h3{margin:0 0 6px;font-size:17px}
.f p{margin:0;color:var(--muted);font-size:15px}
.f .ic{width:36px;height:36px;border-radius:9px;background:var(--gold-bg);color:var(--gold);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:15px;margin-bottom:12px}
.rail{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;counter-reset:s}
.rail div{border-top:3px solid var(--gold);padding-top:14px}
.rail b{display:block;font-size:17px;margin-bottom:4px}
.rail p{margin:0;color:var(--muted);font-size:15px}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.ed{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
.ed.pr{border-color:var(--gold);background:linear-gradient(180deg,var(--gold-bg),var(--card) 60%)}
.ed h3{font-family:var(--f-display);font-size:16px;margin:0 0 4px}
.ed .tg{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.14em;background:var(--gold);color:var(--ink);padding:2px 8px;border-radius:4px;margin-bottom:10px}
.ed ul{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.ed li{padding-left:22px;position:relative;font-size:15px}
.ed li::before{content:"";position:absolute;left:2px;top:.55em;width:10px;height:6px;border-left:2.5px solid var(--gold);border-bottom:2.5px solid var(--gold);transform:rotate(-45deg) translateY(-3px)}
.shots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.shots figure{margin:0}
.shots figcaption{color:var(--muted);font-size:14px;margin-top:8px}
.cost{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:22px 24px}
.cost ul{margin:10px 0 0;padding-left:20px;display:grid;gap:6px;color:var(--fg)}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
summary{cursor:pointer;padding:14px 18px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--gold);font-size:22px;line-height:1}
details[open] summary::after{content:"\2212"}
details p{margin:0;padding:0 18px 16px;color:var(--muted);max-width:70ch}
.band{margin-top:64px;background:var(--gold);color:var(--ink);border-radius:16px;padding:34px 30px;display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.band h2{margin:0 0 6px}.band p{margin:0;max-width:52ch}
.band .btn{background:var(--ink);color:var(--gold)}
.band .btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
footer{padding-block:34px 44px;color:var(--muted);font-size:13px;max-width:78ch}
.robot{width:84px;height:auto}
.robot .eye{transform-origin:center;transform-box:fill-box}
@media (prefers-reduced-motion:no-preference){.robot .eye{animation:bl 4.5s infinite}.robot .ant{animation:gl 2s ease-in-out infinite}
@keyframes bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}@keyframes gl{50%{opacity:.35}}}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr);padding-block:34px 30px}.grid,.rail{grid-template-columns:minmax(0,1fr)}.cmp,.shots{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}nav a.l{display:none}section{padding-block:48px 0}}
</style>
